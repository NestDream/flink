# Secured variant of otel-config.yaml: every receiver requires a bearer token
# (header-based auth) and serves TLS; port 4319 additionally demands an mTLS
# client certificate. Used by OpenTelemetrySecuredReporterITCase.

extensions:
  health_check:
  bearertokenauth:
    token: "itcase-secret-token"

receivers:
  otlp/grpc-auth-tls:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: /tls/server.pem
          key_file: /tls/server-key.pem
  otlp/http-auth-tls:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: /tls/server.pem
          key_file: /tls/server-key.pem
  otlp/grpc-mtls:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        tls:
          cert_file: /tls/server.pem
          key_file: /tls/server-key.pem
          client_ca_file: /tls/ca.pem
  otlp/http-mtls:
    protocols:
      http:
        endpoint: 0.0.0.0:4320
        tls:
          cert_file: /tls/server.pem
          key_file: /tls/server-key.pem
          client_ca_file: /tls/ca.pem

processors:
  batch:

exporters:
  file:
    path: /data/logs.json

service:
  pipelines:
    metrics:
      receivers: [otlp/grpc-auth-tls, otlp/http-auth-tls, otlp/grpc-mtls, otlp/http-mtls]
      exporters: [file]
    traces:
      receivers: [otlp/grpc-auth-tls, otlp/http-auth-tls, otlp/grpc-mtls, otlp/http-mtls]
      exporters: [file]
    logs:
      receivers: [otlp/grpc-auth-tls, otlp/http-auth-tls, otlp/grpc-mtls, otlp/http-mtls]
      exporters: [file]
  extensions: [health_check, bearertokenauth]
